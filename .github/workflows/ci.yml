name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:layers
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - name: No large files (videos never go in the repo)
        run: |
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi
